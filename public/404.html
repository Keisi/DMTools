<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DMTool</title>
    <script>
      // GitHub Pages SPA redirect: stash the FULL path (incl. the /DMTools base) into
      // sessionStorage, then bounce to the app root so index.html loads. index.html
      // replays it via history.replaceState and React Router's basename resolves it.
      // (Saving the base-relative path here would drop /DMTools on restore.)
      sessionStorage.setItem(
        "spa-redirect",
        window.location.pathname + window.location.search + window.location.hash,
      );
      window.location.replace("/DMTools/");
    </script>
  </head>
  <body></body>
</html>
